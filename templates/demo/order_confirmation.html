<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            margin: 20px 0;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .btn {
            display: inline-block;
            margin: 10px 20px 10px 0;
            padding: 12px 24px;
            text-decoration: none;
            border: 2px solid #333;
            border-radius: 6px;
            color: #333;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #333;
            color: #fff;
            text-decoration: none;
        }
        .success {
            background: #e8f5e9;
            padding: 15px;
            border-left: 4px solid #4caf50;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <a href="/demo">← Back</a>
    <h1>Order Confirmation</h1>
    <p>Order ID: {{ order_id }}</p>
    <p>
        Transaction:
        <a href="{{ tx_link }}" target="_blank" rel="noopener noreferrer">{{ tx_hash }}</a>
    </p>
    <p>Thank you for your order!</p>
    <div class="success"><strong>✓ Payment Verified</strong></div>
    <div style="margin-top: 30px;">
        <a href="https://www.youtube.com/watch?v=D6mNVEZ6d1A" class="btn">Access video with English subtitle</a>
        <a href="https://www.youtube.com/watch?v=D6mNVEZ6d1A" class="btn">Access video in original Korean</a>
    </div>
</body>
</html>
