<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy EchoKit</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            margin: 20px 0;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        form {
            margin-top: 30px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #0066cc;
        }
        button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0052a3;
        }
    </style>
</head>
<body>
    <a href="/">← Back</a>
    <h1>Buy EchoKit</h1>
    <p>To purchase EchoKit, please fill out the form below.</p>
    <form action="/buy-echokit/order">
        <label for="name">Name:</label>
        <input type="name" id="name" name="name" required><br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br />
        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br />
        <button type="submit">Buy Now</button>
    </form>
</body>
</html>
